<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" />
  <title>H-eries — 이동 중…</title>
  <!--
    GitHub Pages SPA fallback — 알 수 없는 path 진입 시 (`/heries/about` 등)
    GitHub Pages 가 본 404.html 을 서빙한다. 본 script 는 path 를
    `/?/<rest>` 쿼리로 인코딩하여 루트 (`/heries/`) 로 redirect 한 뒤,
    index.html 의 inline 복원 script 가 history.replaceState 로 원본 path 를
    되살린다. pathSegmentsToKeep=1 = GitHub Pages 의 repo prefix (`/heries`)
    1 segment 를 base 로 유지.
    출처 패턴: rafgraph/spa-github-pages (MIT). 의존성 추가 X.
  -->
  <script type="text/javascript">
    const pathSegmentsToKeep = 1
    const l = window.location
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #6e6e76;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111114; color: #b1b1b8; }
    }
  </style>
</head>
<body>
  <p>이동 중…</p>
</body>
</html>
