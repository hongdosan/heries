<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content-Security-Policy — 외부 스크립트 / iframe / object 차단.
    'unsafe-inline' 은 index.html 의 SPA redirect script + theme apply 인라인 필수.
    img-src self + data: (webp 디코딩 일부 환경 + base64 fallback).
    object-src 'none' / base-uri 'self' = clickjacking 보호.
  -->
  <!-- frame-ancestors 는 meta 태그에서 무시됨 (HTTP header 만 유효). GitHub Pages 는 custom header 미지원 → 본 directive 폐기. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>H-eries — hongdosan의 웹 시리즈</title>
  <meta name="description" content="홍도산 의 오리지널 웹 시리즈 컬렉션." />
  <meta name="theme-color" content="#3050a0" />
  <link rel="icon" type="image/webp" href="/src/shared/images/favicon.webp" />

  <!-- Open Graph + Twitter Card (링크 미리보기) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="H-eries — hongdosan의 웹 시리즈" />
  <meta property="og:description" content="홍도산 의 오리지널 웹 시리즈 컬렉션." />
  <meta property="og:site_name" content="H-eries" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://hongdosan.github.io/heries/" />
  <meta property="og:image" content="https://hongdosan.github.io/heries/content/series/clash-of-multiverses/thumbnails/cover.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="H-eries — hongdosan의 웹 시리즈" />
  <meta name="twitter:description" content="홍도산 의 오리지널 웹 시리즈 컬렉션." />
  <meta name="twitter:image" content="https://hongdosan.github.io/heries/content/series/clash-of-multiverses/thumbnails/cover.webp" />
  <!--
    SPA 라우팅 복원 — GitHub Pages 의 404.html 이 잘못된 경로를
    `/?/<original-path>` 형태로 redirect 해 보낸다. 본 inline script 는
    location.search 의 `/` 시작 패턴을 감지하여 history.replaceState 로
    원본 path 를 복원한 뒤 React Router 가 정상 매칭하도록 한다.
    출처 패턴: rafgraph/spa-github-pages (MIT). 본 프로젝트 의존성 추가 X,
    vanilla JS inline 만으로 충분.
  -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        const decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?')
        window.history.replaceState(
          null,
          '',
          l.pathname.slice(0, -1) + decoded + l.hash
        )
      }
    })(window.location)
  </script>
  <!--
    Theme 적용 — first paint 전 inline 처리 (FOUC 차단).
    localStorage 의 'heries:theme' 값을 읽어 <html data-theme> 부착.
    React Compiler 'all' 모드는 utility 함수도 컴파일 → module top-level 호출 시 useMemoCache hook fail.
    → React 진입 전 처리는 본 inline script 가 SSOT (theme.ts 의 getTheme/applyTheme 로직과 동치 유지).
  -->
  <script type="text/javascript">
    (function () {
      try {
        var v = localStorage.getItem('heries:theme')
        if (v === 'light' || v === 'dark') {
          document.documentElement.setAttribute('data-theme', v)
        }
      } catch (e) { /* localStorage 미사용 환경 (private mode 등) — auto fallback */ }
    })()
  </script>
  <!--
    CSS module 이 import 되기 전 0~수십 ms 동안 사용자에게 보이는 첫 paint 톤.
    base.css 가 로드되면 body { background: var(--bg) } 가 우선 적용되어 본 inline 룰이 덮인다.
    다크 모드 prefers-color-scheme = 사용자 OS 설정 자동 반영 (theme.ts 의 manual override 보다 먼저).
  -->
  <style>
    html, body { margin: 0; background: #ffffff; color: #6e6e76; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]), body { background: #111114; color: #9e9ea6; }
    }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #111114; color: #9e9ea6; }
  </style>
</head>
<body>
  <div id="app">
    <p class="loading">불러오는 중…</p>
  </div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
