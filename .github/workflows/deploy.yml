name: Deploy H-eries to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Safety: ensure reader build only. Author build must NEVER be deployed.
      VITE_AUTHOR_MODE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (reader mode)
        run: npm run build

      - name: Build Storybook (sanity check, not deployed)
        run: npm run build-storybook

      - name: Verify reader dist isolation (Storybook artifacts must NOT be in dist)
        run: |
          if grep -rli "storybook" dist/ 2>/dev/null | grep -v "^$"; then
            echo "::error::Storybook artifacts leaked into dist/"
            exit 1
          fi
          echo "✓ dist/ clean (no storybook artifacts)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
